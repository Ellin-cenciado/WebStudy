[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webstudy"
version = "0.1.0"
description = "A web-based study tracker with carry-over hours"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]
desktop = [
    "pyinstaller>=6.16",
]

[project.scripts]
webstudy = "webstudy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webstudy*"]
